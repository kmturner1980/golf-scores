<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach Admin — Golf Scores</title>
<link rel="icon" href="assets/img/ambrose-golf-logo.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<header class="app-header">
  <img class="brand-logo" src="assets/img/ambrose-golf-logo.png" alt="Ambrose Golf" onerror="this.remove()">
  <div>
    <h1>Coach Admin</h1>
    <p>Roster, rounds, and season stats</p>
  </div>
</header>
<main>
  <div id="loginCard" class="card">
    <h2>Coach Login</h2>
    <div id="loginMessage"></div>
    <form id="loginForm">
      <div class="field">
        <label for="password">Admin Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" id="loginBtn">Log In</button>
    </form>
  </div>

  <div id="dashboard" class="hidden">
    <div class="card">
      <h2>Team Totals</h2>
      <div id="teamTiles" class="stat-grid"></div>
    </div>

    <div class="card">
      <h2>Add Player</h2>
      <div id="addPlayerMessage"></div>
      <form id="addPlayerForm" class="field-row" style="align-items:end">
        <div class="field" style="margin-bottom:0">
          <label for="newPlayerName">Player Name</label>
          <input type="text" id="newPlayerName" required>
        </div>
        <div class="field" style="margin-bottom:0">
          <label for="newPlayerSex">Sex</label>
          <select id="newPlayerSex" required>
            <option value="Boy">Boy</option>
            <option value="Girl">Girl</option>
          </select>
        </div>
        <div class="field" style="margin-bottom:0">
          <button type="submit">Add Player &amp; Generate Link</button>
        </div>
      </form>
      <div id="newLinkBox" class="link-box hidden" style="margin-top:0.75rem">
        <input type="text" id="newLinkInput" readonly>
        <button type="button" id="copyLinkBtn" class="secondary">Copy</button>
      </div>
    </div>

    <div class="card">
      <h2>Roster</h2>
      <div id="rosterTable" class="table-scroll"></div>
    </div>

    <div id="playerDetail" class="card hidden">
      <div class="field-row" style="align-items:start">
        <h2 id="playerDetailName" style="margin-bottom:0.5rem"></h2>
        <div style="text-align:right">
          <button type="button" id="deletePlayerBtn" class="danger">Delete Player</button>
        </div>
      </div>
      <div class="link-box" style="margin-bottom:0.75rem">
        <input type="text" id="playerDetailLink" readonly>
        <button type="button" id="copyDetailLinkBtn" class="secondary">Copy Link</button>
      </div>
      <div class="link-box" style="margin-bottom:0.75rem">
        <span id="playerDetailSexPill" class="pill"></span>
        <select id="playerDetailSexSelect" class="hidden" style="width:auto"></select>
        <button type="button" id="editSexBtn" class="secondary">Edit</button>
        <button type="button" id="saveSexBtn" class="hidden">Save</button>
        <button type="button" id="cancelSexBtn" class="secondary hidden">Cancel</button>
      </div>
      <div id="playerDetailTiles" class="stat-grid" style="margin-bottom:1rem"></div>

      <h3>Coaching Focus</h3>
      <ul id="coachingAdvice" style="margin:0 0 1rem; padding-left:1.2rem"></ul>

      <div id="playerDetailRounds" class="table-scroll"></div>
    </div>

    <div id="editRoundCard" class="card hidden">
      <h2>Edit Round</h2>
      <div id="editRoundMessage"></div>
      <form id="editRoundForm">
        <div class="field-row">
          <div class="field">
            <label for="editDate">Date</label>
            <input type="date" id="editDate" required>
          </div>
          <div class="field">
            <label for="editHolesPlayed">Holes Played</label>
            <select id="editHolesPlayed">
              <option value="18">18 (Full Round)</option>
              <option value="9F">Front 9</option>
              <option value="9B">Back 9</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="editCourseSelect">Course</label>
            <select id="editCourseSelect" required></select>
          </div>
          <div class="field">
            <label for="editTees">Tees</label>
            <input type="text" id="editTees">
          </div>
        </div>
        <div class="field-row" id="editCourseOtherRow">
          <div class="field">
            <label for="editCourseOther">Course Name</label>
            <input type="text" id="editCourseOther">
          </div>
          <div class="field">
            <label for="editCourseOtherCity">City / State</label>
            <input type="text" id="editCourseOtherCity">
          </div>
        </div>

        <div class="table-scroll">
          <table class="hole-table">
            <thead>
              <tr>
                <th>Hole</th>
                <th>Par</th>
                <th>Score</th>
                <th>Fairway</th>
                <th>GIR</th>
                <th>Putts</th>
                <th>Penalty</th>
              </tr>
            </thead>
            <tbody id="editHoleRows"></tbody>
          </table>
        </div>

        <p><strong>Total: <span id="editRunningTotal">0</span></strong></p>

        <div class="field">
          <label for="editNotes">Notes (optional)</label>
          <input type="text" id="editNotes">
        </div>

        <button type="submit" id="editSaveBtn">Save Changes</button>
        <button type="button" id="editCancelBtn" class="secondary">Cancel</button>
      </form>
    </div>
  </div>
</main>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/stats.js"></script>
<script src="assets/js/courses.js"></script>
<script src="assets/js/holeTable.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
